<!DOCTYPE html>
<html lang="en">
<head>
<title>Авторизация</title>
<style>
body {
    display: flex;
    background: #F5F5F5;
    color: #1A1A1A;
    font-size: 17px;
    font-family: Arial;
    justify-content: center;
    text-align: center;
    align-items: center;
}
form {
   background: white;
   width: 400px;
   height: 270px;
   margin: 70px;
   box-shadow: 0 4px 8px rgba(0,0,0,0.1);
   margin-top: 7px;
   border-radius: 9px;
}
h1 {
    font-size: 17px;
    margin-top: 27px;
    margin-bottom: 18px;
}
.login , .psw {
    height: 27px;
    border: 1px solid #1A1A1A;
    background: white;
    border-radius: 1px;
    padding: 12px;
    
}
.button {
    margin-top: 11px;
    cursor: pointer;
    background: #366991;
    color: white;
    width: 64px;
    height: 24px;
    font-size: 17px;
    font-family: Arial;
    border: none;
}
a {
   color: #366991;
}
</style>
</head>
<body>
<form action="/login" method="POST">
<h1>Авторизация</h1>
<p><label>Логин: </label><input type="text" name="login" class="login" value="" required></p>
<p><label>Пароль: </label><input type="password" name="psw" class="psw" value="" required></p>
<p><input type="submit" class="button" value="Войти"></p>
<p><a href="/registration">Регистрация</p>
</form>
</body>
</html>
