<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width">
    <title>Изменение пароля</title>
    <style>
        body {
            background: #F5F5F5;
            color: #1A1A1A;
            font-size: 17px;
            font-family: Arial;
        }
        .nav {
            background: white;
            padding: 27px;
            border-radius: 2px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .menu {
            position: relative;
            display: inline-block;
        }
        .menu::after {
            position: absolute;
            background: #366991;
            content: "☰";
            color: white;
            width: 50px;
            height: 42px;
            top: -24px;
            left: -10px;
            font-size: 29px;
            text-align: center;
        }
        .dropdown {
            top: 17px;
            left: -10px;
            width: 190px;
            position: absolute;
            display: none;
            background: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 2px;
        }
        .dropdown a {
            text-decoration: none;
            display: block;
            padding: 7px;
            color: #366991;
        }
        .menu:hover .dropdown {
            display: inline-block;
        }
        .content {
            display: flex;
            text-align: center;
            justify-content: center;
            align-items: center;
        }
        form {
            background: white;
            width: 400px;
            height: 290px;
            margin: 70px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 4px;
        }
        form h1 {
            font-size: 17px;
            margin-top: 27px;
            margin-bottom: 27px;
        }
        .password , .password1 {
            border: 1px solid #1A1A1A;
            background: white;
            padding: 7px;
            width: 190px;
            height: 11px;
        }
        .button {
            margin-top: 18px;
            text-align: center;
            cursor: pointer;
            color: white;
            background: #366991;
            width: 67px;
            height: 30px;
            border: none;
        }
    </style>
</head>
<body>
<nav class="nav">
    <div class="menu">
        <div class="dropdown">
            <a href="/profile">Учётная запись</a>
            <a href="/projects">Проекты</a>
            <a href="/new_project">Новый проект</a>
            <a href="/exit">Выйти из учётной записи</a>
        </div>
    </div>
</nav>
<div class="content">
    <form action="/update_password/1" method="POST">
        <h1>Изменение пароля</h1>
        <p><label>Текущий пароль: </label><input type="password" class="password" name="password" value="" maxlength="10000" required></p>
        <p><label>Новый пароль: </label><input type="password" class="password1" name="password1" value="" maxlength="10000" required></p>
        <p><input type="submit" class="button" value="Изменить"></p>
    </form>
</div>
</body>
</html>
