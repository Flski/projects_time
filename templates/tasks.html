<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Задачи</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: linear-gradient(135deg, #F4F7FA 0%, #E8EEF5 100%);
  color: #1A1A1A;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 24px 20px;
}

.nav {
  background: #FFFFFF;
  box-shadow: 0 10px 25px rgba(33, 78, 119, 0.08);
  border-radius: 20px;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1100px;
  margin: 0 auto 24px auto;
}

.menu {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

.menu:hover {
  background-color: #F4F7FA;
}

.menu:active {
  transform: scale(0.96);
}

.menu::after {
  content: "☰";
  color: #214E77;
  font-size: 24px;
  line-height: 1;
}

.dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  padding-top: 10px;
  width: 240px;
  z-index: 100;
  filter: drop-shadow(0 12px 24px rgba(33, 78, 119, 0.14));
  animation: fadeInDown 0.2s ease;
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.dropdown a {
  background: #FFFFFF;
  color: #142B42;
  font-size: 15px;
  font-weight: 500;
  display: block;
  padding: 13px 18px;
  text-decoration: none;
  border-bottom: 1px solid #F1F5F9;
  transition: background-color 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
}

.dropdown a:first-child {
  border-radius: 14px 14px 0 0;
}

.dropdown a:last-child {
  border-radius: 0 0 14px 14px;
  border-bottom: none;
}

.dropdown a:only-child {
  border-radius: 14px;
  border-bottom: none;
}

.dropdown a:hover {
  background: #F4F7FA;
  color: #214E77;
  padding-left: 22px;
}

.menu:hover .dropdown {
  display: block;
}

.content {
  background: #FFFFFF;
  box-shadow: 0 10px 25px rgba(33, 78, 119, 0.08);
  border-radius: 20px;
  max-width: 1100px;
  margin: 0 auto;
  padding: 36px 40px;
  text-align: left;
}

.content h1 {
  font-size: 24px;
  font-weight: 600;
  color: #142B42;
  margin-bottom: 16px;
}

.content p {
  color: #334155;
  margin-bottom: 14px;
}

.content p:last-child {
  margin-bottom: 0;
}

</style>
</head>
<body>
<nav class="nav">
  <div class="menu">
    <div class="dropdown">
      <a href="/profile/{{login}}">Учётная запись</a>
      <a href="/projects/{{login}}">Проекты</a>
      <a href="/add_project/{{login}}">Новый проект</a>
      <a href="/exit/{{login}}">Выход</a>
    </div>
  </div>
</nav>
<div class="content">
  <h1>Задачи:</h1>
</div>
</body>
</html>
