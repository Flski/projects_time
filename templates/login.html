<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Авторизация</title>
<style>
:root {
  --bg-gradient-start: #F4F7FA;
  --bg-gradient-end: #E8EEF5;
  --surface-color: #FFFFFF;
  --input-bg: #F9FAFB;
  --input-border: #E2E8F0;
  --text-primary: #142B42;
  --text-body: #1A1A1A;
  --text-muted: #64748B;
  --primary-color: #214E77;
  --primary-hover: #183B5B;
  --focus-ring: rgba(33, 78, 119, 0.15);
  --error-color: #DC2626;
  --error-bg: #FEF2F2;
  --success-color: #16A34A;
  --shadow-color: rgba(33, 78, 119, 0.08);
  --radius-card: 20px;
  --radius-control: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-gradient-start: #0F172A;
    --bg-gradient-end: #1E293B;
    --surface-color: #1E293B;
    --input-bg: #0F172A;
    --input-border: #334155;
    --text-primary: #F8FAFC;
    --text-body: #E2E8F0;
    --text-muted: #94A3B8;
    --primary-color: #38BDF8;
    --primary-hover: #0284C7;
    --focus-ring: rgba(56, 189, 248, 0.2);
    --shadow-color: rgba(0, 0, 0, 0.35);
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
  color: var(--text-body);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  -webkit-font-smoothing: antialiased;
}

form {
  background: var(--surface-color);
  box-shadow: 0 12px 32px var(--shadow-color);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-card);
  width: 100%;
  max-width: 400px;
  padding: 40px 35px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-align: center;
  animation: fadeInUp 0.4s ease-out;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  letter-spacing: -0.02em;
}

.subtitle {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.input-group {
  display: flex;
  flex-direction: column;
  text-align: left;
  gap: 6px;
  position: relative;
}

label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
}

.login,
.password,
input[type="text"],
input[type="email"],
input[type="password"] {
  background: var(--input-bg);
  color: var(--text-body);
  font-family: inherit;
  font-size: 16px;
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1.5px solid var(--input-border);
  border-radius: var(--radius-control);
  outline: none;
  transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
}

.login::placeholder,
.password::placeholder {
  color: var(--text-muted);
  opacity: 0.75;
}

.login:hover:not(:disabled),
.password:hover:not(:disabled) {
  border-color: var(--text-muted);
}

.login:focus,
.password:focus {
  background: var(--surface-color);
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px var(--focus-ring);
}

input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--text-body);
  -webkit-box-shadow: 0 0 0px 1000px var(--input-bg) inset;
  transition: background-color 5000s ease-in-out 0s;
}

.input-error {
  border-color: var(--error-color) !important;
  background: var(--error-bg);
}

.input-error:focus {
  box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
}

.error-message {
  font-size: 12px;
  color: var(--error-color);
  text-align: left;
  margin-top: -2px;
}

.input-success {
  border-color: var(--success-color) !important;
}

.password-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.password-wrapper .password {
  padding-right: 44px;
}

.toggle-password {
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.toggle-password:hover {
  color: var(--text-primary);
}

.form-options {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  margin-top: -4px;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  color: var(--text-muted);
  user-select: none;
}

.checkbox-label input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--primary-color);
  cursor: pointer;
}

.button {
  cursor: pointer;
  background: var(--primary-color);
  color: #FFFFFF;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  width: 100%;
  height: 46px;
  margin-top: 6px;
  border: none;
  border-radius: var(--radius-control);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background-color 0.2s ease, transform 0.1s ease, opacity 0.2s ease;
}

.button:hover:not(:disabled) {
  background: var(--primary-hover);
}

.button:active:not(:disabled) {
  transform: scale(0.98);
}

.button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--primary-color);
  outline-offset: 2px;
}

.button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.divider {
  display: flex;
  align-items: center;
  text-align: center;
  color: var(--text-muted);
  font-size: 12px;
  margin: 4px 0;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  border-bottom: 1px solid var(--input-border);
}

.divider span {
  padding: 0 10px;
}

.button-secondary {
  background: transparent;
  color: var(--text-primary);
  border: 1.5px solid var(--input-border);
  margin-top: 0;
}

.button-secondary:hover:not(:disabled) {
  background: var(--input-bg);
  border-color: var(--text-muted);
}

a {
  color: var(--primary-color);
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  transition: color 0.2s ease;
}

a:hover {
  color: var(--primary-hover);
  text-decoration: underline;
}

.form-footer {
  margin-top: 8px;
  font-size: 14px;
  color: var(--text-muted);
}

@media (max-width: 420px) {
  body {
    padding: 12px;
  }

  form {
    padding: 28px 20px;
    border-radius: 16px;
    gap: 14px;
  }

  h1 {
    font-size: 21px;
  }
}
</style>
</head>
<body>
<form action="/login" method="POST">
  <h1>Авторизация</h1>
  <p><input type="text" class="login" name="login" value="" placeholder="Логин (от 4 до 100 символов)" maxlength="100" required></p>
  <p><input type="password" class="password" name="password" value="" placeholder="Пароль (от 16 до 10000 символов)" maxlength="10000" required></p>
  <p><input type="submit" class="button" value="Авторизация"></p>
  <p><a href="/registration">Регистрация</p>
</form>
</body>
</html>
