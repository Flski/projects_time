<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Авторизация</title>
<style>
  body {
    background: #FCFCFC;
    color: #1A1A1A;
    font-family: Arial;
    font-size: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  form {
    background: #FFFFFF;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    border-radius: 20px;
    width: 420px;
    height: 340px;
    margin-top: -70px;
  }
  h1 {
    font-size: 20px;
    margin-top: 35px;
    margin-bottom: 50px;
  }
  .login , .password {
    background: #FFFFFF;
    color: #1A1A1A;
    font-size: 18px;
    width: 350px;
    height: 42px;
    border: 1px solid #1A1A1A;
    border-radius: 4px;
  }
  .button {
    cursor: pointer;
    background: #214E77;
    color: #FFFFFF;
    font-size: 18px;
    width: 350px;
    height: 35px;
    margin-top: 1px;
    margin-bottom: 0;
    border: none;
    border-radius:4px;
  }
  a {
    color: #214E77;
    font-size: 18px;
  }
</style>
</head>
<body>
<form action="/login" method="POST">
  <h1>Авторизация</h1>
  <p><input type="text" class="login" name="login" value="" placeholder="Логин (от 4 до 100 символов)" maxlength="100" required></p>
  <p><input type="password" class="password" name="password" value="" placeholder="Пароль (от 16 до 10000 символов)" maxlength="10000" required></p>
  <p><input type="submit" class="button" value="Авторизация"></p>
  <p><a href="/registration">Регистрация</p>
</form>
</body>
</html>
