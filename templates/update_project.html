<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Изменение проекта</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: linear-gradient(135deg, #F4F7FA 0%, #E8EEF5 100%);
  color: #1A1A1A;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 24px 20px;
}

.nav {
  background: #FFFFFF;
  box-shadow: 0 10px 25px rgba(33, 78, 119, 0.08);
  border-radius: 20px;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 1100px;
  margin: 0 auto 32px auto;
}

.menu {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 10px;
  cursor: pointer;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

.menu:hover {
  background-color: #F4F7FA;
}

.menu:active {
  transform: scale(0.96);
}

.menu::after {
  content: "☰";
  color: #214E77;
  font-size: 24px;
  line-height: 1;
}

.dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  padding-top: 10px;
  width: 240px;
  z-index: 100;
  filter: drop-shadow(0 12px 24px rgba(33, 78, 119, 0.14));
  animation: fadeInDown 0.2s ease;
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.dropdown a {
  background: #FFFFFF;
  color: #142B42;
  font-size: 15px;
  font-weight: 500;
  display: block;
  padding: 13px 18px;
  text-decoration: none;
  border-bottom: 1px solid #F1F5F9;
  transition: background-color 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
}

.dropdown a:first-child {
  border-radius: 14px 14px 0 0;
}

.dropdown a:last-child {
  border-radius: 0 0 14px 14px;
  border-bottom: none;
}

.dropdown a:only-child {
  border-radius: 14px;
  border-bottom: none;
}

.dropdown a:hover {
  background: #F4F7FA;
  color: #214E77;
  padding-left: 22px;
}

.menu:hover .dropdown {
  display: block;
}

.content {
  background: #FFFFFF;
  box-shadow: 0 10px 25px rgba(33, 78, 119, 0.08);
  border-radius: 20px;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 40px 35px;
  text-align: center;
}

.content form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.content h1 {
  font-size: 24px;
  font-weight: 600;
  color: #142B42;
  margin-bottom: 24px;
}

.name, .created_at {
  background: #F9FAFB;
  color: #1A1A1A;
  font-family: inherit;
  font-size: 16px;
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1.5px solid #E2E8F0;
  border-radius: 10px;
  outline: none;
  transition: all 0.2s ease;
}

.description {
  background: #F9FAFB;
  color: #1A1A1A;
  font-family: inherit;
  font-size: 16px;
  line-height: 1.5;
  width: 100%;
  min-height: 120px;
  padding: 12px 14px;
  border: 1.5px solid #E2E8F0;
  border-radius: 10px;
  outline: none;
  resize: vertical;
  transition: all 0.2s ease;
}

.name:focus, .created_at:focus, .description:focus {
  background: #FFFFFF;
  border-color: #214E77;
  box-shadow: 0 0 0 3px rgba(33, 78, 119, 0.12);
}

.button {
  cursor: pointer;
  background: #214E77;
  color: #FFFFFF;
  font-size: 16px;
  font-weight: 600;
  width: 100%;
  max-width: 200px;
  height: 46px;
  margin: 8px auto 0 auto;
  border: none;
  border-radius: 10px;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

.button:hover {
  background: #183B5B;
}

.button:active {
  transform: scale(0.98);
}

</style>
</head>
<body>
<nav class="nav">
  <div class="menu">
    <div class="dropdown">
      <a href="/profile/{{login}}">Учётная запись</a>
      <a href="/projects/{{login}}">Проекты</a>
      <a href="/add_project/{{login}}">Новый проект</a>
      <a href="/exit/{{login}}">Выход</a>
    </div>
  </div>
</nav>
<div class="content">
  <form action="/update_project/{{login}}/" method="POST">
    <h1>Изменение проекта</h1>
    <p><input type="text" class="name" name="name" value="{{name}}" placeholder="Название (от 4 до 100 символов)" maxlength="100" required></p>
    <p><input type="text" class="created_at" name="created_at" value="{{created_at}}" placeholder="Дата ГГГГ-ММ-ДД ЧЧ:ММ (не обязательна)" maxlength="100"></p>
    <p><textarea class="description" name="description" placeholder="Описание (до 10000 символов, не обязательно)" maxlength="10000">{{description}}</textarea></p>
    <p><input type="submit" class="button" value="Изменение"></p>
  </form>
</div>
</body>
</html>
