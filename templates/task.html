<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Задача</title>
<style>
:root {
  --bg-gradient-start: #F4F7FA;
  --bg-gradient-end: #E8EEF5;
  --surface-color: #FFFFFF;
  --input-bg: #F9FAFB;
  --input-border: #E2E8F0;
  --divider-color: #F1F5F9;
  --text-primary: #142B42;
  --text-body: #1A1A1A;
  --text-muted: #64748B;
  --primary-color: #214E77;
  --primary-hover: #183B5B;
  --focus-ring: rgba(33, 78, 119, 0.15);
  --error-color: #DC2626;
  --error-bg: #FEF2F2;
  --success-color: #16A34A;
  --shadow-color: rgba(33, 78, 119, 0.08);
  --dropdown-shadow: rgba(33, 78, 119, 0.14);
  --radius-card: 20px;
  --radius-dropdown: 14px;
  --radius-control: 10px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-gradient-start: #0F172A;
    --bg-gradient-end: #1E293B;
    --surface-color: #1E293B;
    --input-bg: #0F172A;
    --input-border: #334155;
    --divider-color: #334155;
    --text-primary: #F8FAFC;
    --text-body: #E2E8F0;
    --text-muted: #94A3B8;
    --primary-color: #38BDF8;
    --primary-hover: #0284C7;
    --focus-ring: rgba(56, 189, 248, 0.2);
    --shadow-color: rgba(0, 0, 0, 0.35);
    --dropdown-shadow: rgba(0, 0, 0, 0.45);
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
  color: var(--text-body);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 24px 20px;
  -webkit-font-smoothing: antialiased;
}

.nav {
  background: var(--surface-color);
  box-shadow: 0 12px 32px var(--shadow-color);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-card);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  max-width: 1100px;
  margin: 0 auto 32px auto;
  position: relative;
  z-index: 50;
}

.nav-brand {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  text-decoration: none;
  letter-spacing: -0.02em;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 20px;
}

.nav-links a {
  color: var(--text-muted);
  font-size: 15px;
  font-weight: 500;
  text-decoration: none;
  transition: color 0.2s ease;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--primary-color);
}

.menu {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: var(--radius-control);
  cursor: pointer;
  user-select: none;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

.menu:hover {
  background-color: var(--input-bg);
}

.menu:active {
  transform: scale(0.96);
}

.menu:focus-visible {
  outline: 2px solid var(--primary-color);
  outline-offset: 2px;
}

.menu::after {
  content: "☰";
  color: var(--primary-color);
  font-size: 24px;
  line-height: 1;
}

.dropdown {
  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  padding-top: 10px;
  width: 240px;
  z-index: 100;
  filter: drop-shadow(0 12px 24px var(--dropdown-shadow));
  animation: fadeInDown 0.2s ease;
}

.dropdown.dropdown-right {
  left: auto;
  right: 0;
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.dropdown a {
  background: var(--surface-color);
  color: var(--text-primary);
  font-size: 15px;
  font-weight: 500;
  display: block;
  padding: 13px 18px;
  text-decoration: none;
  border-bottom: 1px solid var(--divider-color);
  transition: background-color 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
}

.dropdown a:first-child {
  border-radius: var(--radius-dropdown) var(--radius-dropdown) 0 0;
}

.dropdown a:last-child {
  border-radius: 0 0 var(--radius-dropdown) var(--radius-dropdown);
  border-bottom: none;
}

.dropdown a:only-child {
  border-radius: var(--radius-dropdown);
  border-bottom: none;
}

.dropdown a:hover,
.dropdown a.active {
  background: var(--input-bg);
  color: var(--primary-color);
  padding-left: 22px;
}

.dropdown a.danger {
  color: var(--error-color);
}

.dropdown a.danger:hover {
  background: var(--error-bg);
}

.menu:hover .dropdown,
.menu:focus-within .dropdown,
.menu.is-open .dropdown {
  display: block;
}

.content {
  background: var(--surface-color);
  box-shadow: 0 12px 32px var(--shadow-color);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: var(--radius-card);
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 40px 35px;
  text-align: center;
  animation: fadeInUp 0.4s ease-out;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.content form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.content h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}

.subtitle {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 16px;
}

.input-group {
  display: flex;
  flex-direction: column;
  text-align: left;
  gap: 6px;
  position: relative;
}

.datetime-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
}

.name,
.created_at,
.datetime_start,
.datetime_end,
input[type="text"],
input[type="date"],
input[type="datetime-local"],
select {
  background: var(--input-bg);
  color: var(--text-body);
  font-family: inherit;
  font-size: 16px;
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1.5px solid var(--input-border);
  border-radius: var(--radius-control);
  outline: none;
  transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
}

.description,
textarea {
  background: var(--input-bg);
  color: var(--text-body);
  font-family: inherit;
  font-size: 16px;
  line-height: 1.5;
  width: 100%;
  min-height: 120px;
  padding: 12px 14px;
  border: 1.5px solid var(--input-border);
  border-radius: var(--radius-control);
  outline: none;
  resize: vertical;
  transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
}

.name::placeholder,
.created_at::placeholder,
.datetime_start::placeholder,
.datetime_end::placeholder,
.description::placeholder {
  color: var(--text-muted);
  opacity: 0.75;
}

.name:hover:not(:disabled),
.created_at:hover:not(:disabled),
.datetime_start:hover:not(:disabled),
.datetime_end:hover:not(:disabled),
.description:hover:not(:disabled) {
  border-color: var(--text-muted);
}

.name:focus,
.created_at:focus,
.datetime_start:focus,
.datetime_end:focus,
.description:focus,
input[type="date"]:focus,
input[type="datetime-local"]:focus,
select:focus {
  background: var(--surface-color);
  border-color: var(--primary-color);
  box-shadow: 0 0 0 3px var(--focus-ring);
}

.datetime_start,
.datetime_end,
input[type="date"],
input[type="datetime-local"] {
  color-scheme: light dark;
}

input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--text-body);
  -webkit-box-shadow: 0 0 0px 1000px var(--input-bg) inset;
  transition: background-color 5000s ease-in-out 0s;
}

.input-error {
  border-color: var(--error-color) !important;
  background: var(--error-bg);
}

.input-error:focus {
  box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
}

.error-message {
  font-size: 12px;
  color: var(--error-color);
  text-align: left;
  margin-top: -2px;
}

.input-success {
  border-color: var(--success-color) !important;
}

.char-counter {
  font-size: 12px;
  color: var(--text-muted);
  text-align: right;
  margin-top: -2px;
}

.form-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 8px;
}

.button {
  cursor: pointer;
  background: var(--primary-color);
  color: #FFFFFF;
  font-family: inherit;
  font-size: 16px;
  font-weight: 600;
  width: 100%;
  max-width: 200px;
  height: 46px;
  margin: 8px auto 0 auto;
  border: none;
  border-radius: var(--radius-control);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background-color 0.2s ease, transform 0.1s ease, opacity 0.2s ease;
}

.form-actions .button {
  margin: 0;
}

.button:hover:not(:disabled) {
  background: var(--primary-hover);
}

.button:active:not(:disabled) {
  transform: scale(0.98);
}

.button:focus-visible,
a:focus-visible {
  outline: 2px solid var(--primary-color);
  outline-offset: 2px;
}

.button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.button-secondary {
  background: transparent;
  color: var(--text-primary);
  border: 1.5px solid var(--input-border);
}

.button-secondary:hover:not(:disabled) {
  background: var(--input-bg);
  border-color: var(--text-muted);
}

.button-danger {
  background: var(--error-color);
  color: #FFFFFF;
}

.button-danger:hover:not(:disabled) {
  opacity: 0.9;
}

form a {
  display: inline-block;
  color: var(--primary-color);
  font-size: 14px;
  font-weight: 500;
  text-decoration: none;
  margin: 4px auto 0 auto;
  transition: color 0.2s ease;
}

form a:hover {
  color: var(--primary-hover);
  text-decoration: underline;
}

form a.danger-link {
  color: var(--error-color);
}

@media (max-width: 600px) {
  body {
    padding: 16px 12px;
  }

  .nav {
    padding: 12px 16px;
    border-radius: 16px;
    margin-bottom: 20px;
  }

  .content {
    padding: 28px 20px;
    border-radius: 16px;
  }

  .content h1 {
    font-size: 21px;
  }

  .datetime-row {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .form-actions {
    flex-direction: column;
  }

  .button {
    max-width: 100%;
  }
}
</style>
</head>
<body>
<nav class="nav">
  <div class="menu">
    <div class="dropdown">
      <a href="/profile/{{login}}">Учётная запись</a>
      <a href="/projects/{{login}}">Проекты</a>
      <a href="/add_project/{{login}}">Новый проект</a>
      <a href="/exit/{{login}}">Выход</a>
    </div>
  </div>
</nav>
<div class="content">
  <form action="/delete_task/{{login}}/{{project_name}}/{{task_name}}" method="POST">
    <h1>Задача</h1>
    <p><input type="text" class="name" name="name" value="Название: {{name}}" disabled></p>
    <p><input type="text" class="created_at" name="created_at" value="Дата и время: {{created_at}}" disabled></p>
    <p><textarea class="description" name="description" disabled>Описание: {{description}}</textarea></p>
    <p><input type="text" class="datetime_start" name="datetime_start" value="Дата и время старта: {{datetime_start}}" disabled></p>
    <p><input type="text" class="datetime_end" name="datetime_end" value="Дата и время завершения: {{datetime_end}}" disabled></p>
    <p><input type="submit" class="button" value="Удаление"></p>
    <p><a href="/update_task/{{login}}/{{project_name}}/{{task_name}}">Изменение задачи</p>
  </form>
</div>
</body>
</html>
