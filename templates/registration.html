<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<title>Регистрация</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: linear-gradient(135deg, #F4F7FA 0%, #E8EEF5 100%);
  color: #1A1A1A;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 16px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

form {
  background: #FFFFFF;
  box-shadow: 0 10px 25px rgba(33, 78, 119, 0.08);
  border-radius: 20px;
  width: 100%;
  max-width: 400px;
  padding: 40px 35px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-align: center;
}

h1 {
  font-size: 24px;
  font-weight: 600;
  color: #142B42;
  margin-bottom: 12px;
}

.login, .password, .password1 {
  background: #F9FAFB;
  color: #1A1A1A;
  font-size: 16px;
  width: 100%;
  height: 46px;
  padding: 0 14px;
  border: 1.5px solid #E2E8F0;
  border-radius: 10px;
  outline: none;
  transition: all 0.2s ease;
}

.login:focus, .password:focus, .password1:focus {
  background: #FFFFFF;
  border-color: #214E77;
  box-shadow: 0 0 0 3px rgba(33, 78, 119, 0.12);
}

.button {
  cursor: pointer;
  background: #214E77;
  color: #FFFFFF;
  font-size: 16px;
  font-weight: 600;
  width: 100%;
  height: 46px;
  margin-top: 6px;
  border: none;
  border-radius: 10px;
  transition: background-color 0.2s ease, transform 0.1s ease;
}

.button:hover {
  background: #183B5B;
}

.button:active {
  transform: scale(0.98);
}

a {
  color: #214E77;
  font-size: 14px;
  text-decoration: none;
  margin-top: 8px;
  transition: color 0.2s ease;
}

a:hover {
  color: #183B5B;
  text-decoration: underline;
}

</style>
</head>
<body>
<form action="/registration" method="POST">
  <h1>Регистрация</h1>
  <p><input type="text" class="login" name="login" value="" placeholder="Логин (от 4 до 100 символов)" maxlength="100" required></p>
  <p><input type="password" class="password" name="password" value="" placeholder="Пароль (от 16 до 10000 символов)" maxlength="10000" required></p>
  <p><input type="password" class="password1" name="password1" value="" placeholder="Повтор пароля" maxlength="10000" required></p>
  <p><input type="submit" class="button" value="Регистрация"></p>
  <p><a href="/login">Авторизация</p>
</form>
</body>
</html>
