<html>
<head>
<meta name="viewport" content="width=device-width">
<title>Проекты</title>
<style>
  body {
    background: #FCFCFC;
    color: #1A1A1A;
    font-family: Arial;
    font-size: 18px;
  }
  .nav {
    background: #FFFFFF;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    border-radius: 4px;
    padding: 37px;
  }
  .menu {
    position: relative;
    display: inline-block;
  }
  .menu::after {
    position: absolute;
    content: "☰";
    color: #214E77;
    font-size: 45px;
    left: -15px;
    top: -34px;
  }
  .dropdown {
    display: none;
    position: absolute;
    background: #FFFFFF;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    border-radius: 7px;
    width: 220px;
    height: 150px;
    left: -15px;
    top: 24px;      
  }
  .dropdown a {
    color: #214E77;
    font-size: 18px;
    display: block;
    padding: 7px;
    text-decoration: none;
  }
  .menu:hover .dropdown {
    display: inline-block;
  }
  .content {
    text-align: left;
  }
  .content h1 {
    font-size: 18px;
    margin-left: 7px;
  }
</style>
</head>
<body>
<nav class="nav">
  <div class="menu">
    <div class="dropdown">
      <a href="/profile/{{login}}">Учётная запись</a>
      <a href="/projects/{{login}}">Проекты</a>
      <a href="/add_project/{{login}}">Новый проект</a>
      <a href="/exit/{{login}}">Выход</a>
    </div>
  </div>
</nav>
<div class="content">
  <h1>Проекты:</h1>
</div>
</body>
</html>
